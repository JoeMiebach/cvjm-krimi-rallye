<!-- 
  Team-Details Modal
  Wird per JS geöffnet, wenn Admin auf "Details"-Button klickt
  Daten werden via GET /api/admin/team/{id}/progress geladen
-->
<div id="team-details-modal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width: 900px;">
    <div class="modal-header">
      <h3 id="modal-team-name">Team Details</h3>
      <button class="close-btn" onclick="closeTeamDetails()">&times;</button>
    </div>
    
    <div class="modal-body">
      <!-- Übersicht -->
      <div class="team-overview">
        <div class="stat-card">
          <strong>Aktueller Node:</strong>
          <span id="stat-current-node">-</span>
        </div>
        <div class="stat-card">
          <strong>Gelö³¹¹ste Stationen:</strong>
          <span id="stat-solved-count">0</span>
        </div>
        <div class="stat-card">
          <strong>Hint verwendet:</strong>
          <span id="stat-hints">0</span>
        </div>
        <div class="stat-card">
          <strong>Letzte Aktivitä¹¹t:</strong>
          <span id="stat-last-active">-</span>
        </div>
      </div>
      
      <!-- Chat-Historie -->
      <section>
        <h4>Chat-Historie</h4>
        <table class="data-table">
          <thead>
            <tr>
              <th>Node</th>
              <th>Empfangen</th>
              <th>Antwort</th>
              <th>Beantwortet</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="chat-history-body">
            <!-- Wird per JS gefä¹¹llt -->
          </tbody>
        </table>
      </section>
      
      <!-- Gelö³¹¹ste Stationen -->
      <section>
        <h4>Gelö³¹¹ste Stationen</h4>
        <table class="data-table">
          <thead>
            <tr>
              <th>Station</th>
              <th>Gelö³¹¹st um</th>
              <th>Code</th>
            </tr>
          </thead>
          <tbody id="solved-stations-body">
            <!-- Wird per JS gefä¹¹llt -->
          </tbody>
        </table>
      </section>
      
      <!-- God Mode Actions -->
      <section class="god-mode-section">
        <h4>God Mode Aktionen</h4>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="openGodMode()">
            God Mode ö11ffnen
          </button>
          <button class="btn btn-warning" onclick="resetTeam()">
            Team zurä¹¹cksetzen
          </button>
        </div>
      </section>
    </div>
  </div>
</div>

<style>
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  overflow-y: auto;
}

.modal-content {
  background: white;
  margin: 50px auto;
  padding: 20px;
  border-radius: 8px;
  max-width: 900px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.close-btn {
  background: none;
  border: none;
  font-size: 28px;
  cursor: pointer;
}

.team-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 6px;
  text-align: center;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
}

.data-table th, .data-table td {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

.data-table th {
  background: #f0f0f0;
}

.god-mode-section {
  background: #fff3cd;
  padding: 15px;
  border-radius: 6px;
  margin-top: 20px;
}

.action-buttons {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

.btn-primary { background: #007bff; color: white; }
.btn-warning { background: #ffc107; color: #212529; }
.btn-danger { background: #dc3545; color: white; }
</style>

<script>
let currentTeamId = null;

async function openTeamDetails(teamId, teamName) {
  currentTeamId = teamId;
  document.getElementById('modal-team-name').textContent = teamName;
  document.getElementById('team-details-modal').style.display = 'block';
  
  // Daten laden
  await loadTeamProgress(teamId);
}

function closeTeamDetails() {
  document.getElementById('team-details-modal').style.display = 'none';
  currentTeamId = null;
}

async function loadTeamProgress(teamId) {
  try {
    const response = await fetch(`/api/admin/team/${teamId}/progress`);
    const data = await response.json();
    
    if (data.error) {
      alert('Fehler: ' + data.error);
      return;
    }
    
    // Übersicht füllen
    document.getElementById('stat-current-node').textContent = data.current_node_id || '-';
    document.getElementById('stat-solved-count').textContent = data.solved_stations.length;
    document.getElementById('stat-hints').textContent = data.hints_used;
    document.getElementById('stat-last-active').textContent = data.last_active || '-';
    
    // Chat-Historie füllen
    const chatBody = document.getElementById('chat-history-body');
    chatBody.innerHTML = '';
    data.chat_history.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.node_id}</td>
        <td>${new Date(row.received_at).toLocaleString()}</td>
        <td>${row.answer || '-'}</td>
        <td>${row.answered_at ? new Date(row.answered_at).toLocaleString() : '-'}</td>
        <td>
          ${row.is_correct === null ? '-' : 
            (row.is_correct ? '✅ Richtig' : '❌ Falsch')}
        </td>
      `;
      chatBody.appendChild(tr);
    });
    
    // Gelö³¹¹ste Stationen füllen
    const stationsBody = document.getElementById('solved-stations-body');
    stationsBody.innerHTML = '';
    data.solved_stations.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${row.station_id}</td>
        <td>${new Date(row.solved_at).toLocaleString()}</td>
        <td><code>${row.code}</code></td>
      `;
      stationsBody.appendChild(tr);
    });
    
  } catch (e) {
    console.error(e);
    alert('Netzwerkfehler');
  }
}

function openGodMode() {
  if (!currentTeamId) return;
  window.location.href = `/admin/team/${currentTeamId}/view`;
}

async function resetTeam() {
  if (!currentTeamId) return;
  if (!confirm('Team wirklich zurä¹¹cksetzen? Chat-Historie wird gelö311scht!')) return;
  
  try {
    const response = await fetch(`/api/admin/team/${currentTeamId}/reset`, {
      method: 'POST'
    });
    const result = await response.json();
    
    if (result.success) {
      alert('Team zurä¹¹ckgesetzt!');
      await loadTeamProgress(currentTeamId);
    } else {
      alert('Fehler: ' + result.error);
    }
  } catch (e) {
    console.error(e);
    alert('Netzwerkfehler');
  }
}
</script>
