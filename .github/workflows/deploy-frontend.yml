# .github/workflows/deploy-frontend.yml
#
# Baut team-app und admin-app bei jedem Push auf main mit Aenderungen unter
# frontend/** und laedt die jeweiligen dist/-Ordner per SFTP auf STRATO hoch.
# Kann zusaetzlich manuell im Actions-Tab ueber "Run workflow" gestartet werden.
#
# Voraussetzung: Gleiche Repository-Secrets wie beim Backend-Deploy
# (STRATO_SFTP_HOST, STRATO_SFTP_USER, STRATO_SFTP_PASSWORD).
#
# WICHTIG: Der Ordner /stadtrallye ist auf dem STRATO-Server das Document-Root
# der Domain selbst, KEIN URL-Unterpfad. Dateisystem-Pfad /stadtrallye/team
# entspricht der URL joe-miebach.de/team (nicht joe-miebach.de/stadtrallye/team).
# Deshalb muss --base beim Vite-Build nur /team/ bzw. /admin/ sein, waehrend
# remote_path weiterhin den vollen Dateisystem-Pfad /stadtrallye/team bzw.
# /stadtrallye/admin nutzt. Falls sich der Zielordner auf dem Server je
# aendert, muessen BEIDE Werte (base und remote_path) angepasst werden.
#
# KORRIGIERT (09.09.2026): wlixcc/SFTP-Deploy-Action matched bei einem
# Wildcard-Glob wie "dist/*" KEINE Dotfiles (z.B. .htaccess) -- die Action hat
# hierfuer keine Konfigurationsoption. Die public/.htaccess (SPA-Rewrite fuer
# react-router-dom, siehe 02_Technische_Spezifikation_PHP_v3.md, Abschnitt
# "Deployment") wurde dadurch von Vite zwar korrekt nach dist/.htaccess
# kopiert, aber nie mit hochgeladen -- Symptom war ein 404 bei Reload/
# Direktaufruf von Unterrouten wie /admin/dashboard. Fix: zusaetzlicher
# Upload-Schritt pro App, der GENAU diese eine Datei im Einzeldatei-Modus
# der Action uebertraegt (kein Wildcard-Glob, daher kein Dotfile-Problem).


name: Deploy Frontend via SFTP


on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}


jobs:
  deploy-team-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4


      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Abhaengigkeiten installieren
        working-directory: frontend/team-app
        run: npm ci


      - name: Produktions-Build
        working-directory: frontend/team-app
        run: npm run build -- --base=/team/
        env:
          VITE_API_BASE_URL: https://joe-miebach.de/api


      - name: Team-App per SFTP hochladen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STRATO_SFTP_USER }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          local_path: "./frontend/team-app/dist/*"
          remote_path: "/stadtrallye/team"
          sftp_only: true


      - name: .htaccess separat hochladen (Wildcard-Glob uebergeht Dotfiles)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STRATO_SFTP_USER }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          local_path: "./frontend/team-app/dist/.htaccess"
          remote_path: "/stadtrallye/team"
          sftp_only: true


  deploy-admin-app:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4


      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Abhaengigkeiten installieren
        working-directory: frontend/admin-app
        run: npm ci


      - name: Produktions-Build
        working-directory: frontend/admin-app
        run: npm run build -- --base=/admin/
        env:
          VITE_API_BASE_URL: https://joe-miebach.de/api
          # Platzhalter, nur noch als Fallback relevant -- die admin-app
          # liest rallye_id inzwischen aus dem RallyeContext (Admin-Dropdown),
          # siehe 00_Project_Brief_Entscheidungslog_v3.md, Punkt 15.
          VITE_DEFAULT_RALLYE_ID: "1"


      - name: Admin-App per SFTP hochladen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STRATO_SFTP_USER }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          local_path: "./frontend/admin-app/dist/*"
          remote_path: "/stadtrallye/admin"
          sftp_only: true


      - name: .htaccess separat hochladen (Wildcard-Glob uebergeht Dotfiles)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STRATO_SFTP_USER }}
          server: ${{ secrets.STRATO_SFTP_HOST }}
          password: ${{ secrets.STRATO_SFTP_PASSWORD }}
          port: 22
          local_path: "./frontend/admin-app/dist/.htaccess"
          remote_path: "/stadtrallye/admin"
          sftp_only: true
